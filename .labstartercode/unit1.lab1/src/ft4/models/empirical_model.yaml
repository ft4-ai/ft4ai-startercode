# TODO-LAB unit1.lab1
# Experiment with different values of these hyperparameters.
# Some suggestions are given below, but all values are up to you.
#
# Overrides defaults.yaml. Drop tweaks you don't want to commit into empirical_model.local.yaml.
# You can also config on the command line:
#     ft4 train path/to/empirical_model.py --model.n=2

model:
  n: !TODO-LAB unit1.lab1 # What size n-gram? This determines the model's behavior, power, and performance.
  min_distinct_suffixes: 4   # prune prefixes seen with < this many distinct next-tokens
  smoothing: 0.0             # additive (Laplace) smoothing during generation

data:
  class_path: ft4.pipeline.stories_data_module.StoriesDataModule
  init_args:
    seq_len: 512
    batch_size: 2048          # Tune for max speed; you should be able to make this quite large
    val_batch_size: 32        # Keep small to fit in memory
    data_size: !TODO-LAB unit1.lab1   # "small" for fast dev; then "medium" or "full" for best results

trainer:
  accelerator: cpu            # this model's forward is a Python per-position loop; CPU > GPU here
  max_epochs: 1               # no benefit to more epochs
  precision: 32-true          # no gradients
  gradient_clip_val: 0        # no gradients to clip
  limit_val_batches: 8        # 8 × 32 = 256 sequences per val — fast, stable val_ce
  num_sanity_val_steps: 4     #
  enable_model_summary: false # nothing to summarize — the model has no parameters
